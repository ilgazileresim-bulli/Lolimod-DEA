<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>LoliMod-İDEA Help — Code Library</title>

    <link rel="icon" type="image/x-icon" href="icon.ico">

    <style>
        :root {
            --bg: #050711;
            --sidebar: #080d18;
            --panel: #0c1322;
            --panel2: #111a2c;
            --line: rgba(255, 255, 255, .075);
            --text: #f5f7ff;
            --muted: #7f8ba2;
            --purple: #7c5cff;
            --blue: #55a7ff;
            --green: #42d392;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Inter, Segoe UI, Arial, sans-serif;
            color: var(--text);
            background: #050711;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            height: 100vh;
            display: grid;
            grid-template-columns: 270px 1fr;
            grid-template-rows: 70px 1fr;
        }


        /* TOP BAR */

        .topbar {
            grid-column: 1/-1;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(7, 11, 20, .94);
        }

        .brand {
            width: 230px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
        }

        .brand img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 10px;
        }

        .brand span {
            background: linear-gradient(90deg, #fff, #9e8aff, #55a7ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .searchWrap {
            flex: 1;
            max-width: 720px;
            position: relative;
        }

        .search {
            width: 100%;
            height: 44px;
            padding: 0 16px 0 42px;
            border: 1px solid var(--line);
            outline: none;
            border-radius: 12px;
            background: #0b1120;
            color: #fff;
        }

        .search:focus {
            border-color: rgba(124, 92, 255, .55);
            box-shadow: 0 0 0 3px rgba(124, 92, 255, .08);
        }

        .searchIcon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #68758c;
        }

        .topActions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .topBtn {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #0c1322;
            color: #aeb8ca;
            padding: 9px 12px;
        }

        .topBtn:hover {
            color: #fff;
        }

        .back {
            background: linear-gradient(135deg, var(--purple), var(--blue));
            color: #fff;
            border: 0;
        }


        /* SIDEBAR */

        .sidebar {
            grid-column: 1;
            grid-row: 2;
            overflow: auto;
            border-right: 1px solid var(--line);
            background: linear-gradient(180deg, #080d18, #070b14);
        }

        .sideTitle {
            padding: 20px 17px 10px;
            color: #56647c;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.7px;
            text-transform: uppercase;
        }

        .sideCategory {
            width: calc(100% - 16px);
            margin: 2px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #8490a6;
            padding: 9px 10px;
            text-align: left;
            font-size: 12px;
        }

        .sideCategory:hover {
            background: rgba(255, 255, 255, .035);
            color: #fff;
        }

        .sideCategory.active {
            color: #fff;
            background: rgba(124, 92, 255, .14);
            box-shadow: inset 3px 0 0 var(--purple);
        }

        .sideCount {
            color: #56647b;
            font-size: 10px;
        }


        /* MAIN */

        .main {
            min-width: 0;
            grid-column: 2;
            grid-row: 2;
            overflow: auto;
            background:
                radial-gradient(circle at 80% 0%, rgba(124, 92, 255, .06), transparent 30%);
        }

        .content {
            width: min(1250px, calc(100% - 42px));
            margin: auto;
            padding: 30px 0 70px;
        }

        .pageHead {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 25px;
        }

        .eyebrow {
            color: #9583ff;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .pageHead h1 {
            font-size: 35px;
            letter-spacing: -1.5px;
            margin-top: 7px;
        }

        .pageHead p {
            color: var(--muted);
            margin-top: 7px;
            line-height: 1.6;
        }

        .resultCount {
            padding: 11px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #0b1120;
            color: #aab5c9;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 800;
        }


        /* FILTER */

        .filterBar {
            display: flex;
            gap: 8px;
            overflow: auto;
            padding-bottom: 15px;
        }

        .filter {
            flex: 0 0 auto;
            border: 1px solid var(--line);
            background: #0b1120;
            color: #78859b;
            border-radius: 9px;
            padding: 8px 11px;
            font-size: 11px;
            font-weight: 800;
        }

        .filter.active {
            color: #fff;
            border-color: rgba(124, 92, 255, .45);
            background: rgba(124, 92, 255, .14);
        }


        /* GRID */

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 17px;
            background:
                linear-gradient(145deg, #0d1423, #090f1a);
            transition: .18s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(124, 92, 255, .35);
            box-shadow: 0 16px 40px rgba(0, 0, 0, .27);
        }

        .cardHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .id {
            color: #56637a;
            font-size: 10px;
            font-weight: 900;
        }

        .cat {
            color: #a391ff;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .card h3 {
            font-size: 14px;
            margin: 13px 0 7px;
        }

        .desc {
            color: #7e8aa0;
            line-height: 1.55;
            font-size: 11px;
            min-height: 53px;
        }

        .file {
            margin-top: 12px;
            padding: 8px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            border-radius: 8px;
            background: #070c15;
            color: #5e6c83;
            font-family: Consolas, monospace;
            font-size: 9px;
        }

        .cardBottom {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .open {
            border: 0;
            border-radius: 9px;
            padding: 8px 11px;
            background: linear-gradient(135deg, #7256ee, #477fd7);
            color: #fff;
            font-size: 10px;
            font-weight: 900;
        }


        /* PAGINATION */

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            padding-top: 25px;
        }

        .page {
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #0b1120;
            color: #77849a;
            padding: 8px 11px;
            font-size: 11px;
        }

        .page.active {
            color: #fff;
            background: #7055ed;
        }


        /* DETAIL */

        .detail {
            position: fixed;
            z-index: 3000;
            inset: 0;
            display: none;
            background: rgba(0, 0, 0, .73);
            backdrop-filter: blur(9px);
        }

        .detail.show {
            display: flex;
        }

        .detailPanel {
            width: min(1050px, calc(100% - 30px));
            max-height: 92vh;
            margin: auto;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #080d18;
            box-shadow: 0 35px 110px rgba(0, 0, 0, .75);
        }

        .detailTop {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 17px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(8, 13, 24, .96);
            backdrop-filter: blur(15px);
        }

        .detailTop h2 {
            font-size: 17px;
        }

        .close {
            width: 37px;
            height: 37px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #11192a;
            color: #fff;
        }

        .detailBody {
            padding: 20px;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .metaBox {
            border: 1px solid var(--line);
            border-radius: 11px;
            padding: 12px;
            background: #0c1322;
        }

        .metaBox small {
            display: block;
            color: #59677d;
            font-size: 9px;
            margin-bottom: 5px;
        }

        .metaBox strong {
            font-size: 11px;
            word-break: break-word;
        }

        .explain {
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 17px;
            background: #0c1322;
            color: #9aa6ba;
            line-height: 1.7;
            font-size: 12px;
            margin-bottom: 14px;
        }

        .codeTitle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .codeTitle strong {
            font-size: 12px;
        }

        .copy {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #131d30;
            color: #fff;
            padding: 7px 10px;
            font-size: 10px;
        }

        .code {
            overflow: auto;
            max-height: 500px;
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 18px;
            background: #03070d;
            color: #d9e1f3;
            font-family: Consolas, Monaco, monospace;
            font-size: 11px;
            line-height: 1.7;
            white-space: pre;
        }

        .usage {
            margin-top: 14px;
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 16px;
            background: #0c1322;
        }

        .usage strong {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
        }

        .usage pre {
            white-space: pre-wrap;
            color: #929fb4;
            font-family: Consolas, monospace;
            font-size: 11px;
        }


        /* EMPTY */

        .empty {
            grid-column: 1/-1;
            padding: 80px 20px;
            text-align: center;
            color: #647188;
        }


        /* MOBILE */

        @media(max-width:1050px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media(max-width:800px) {

            body {
                overflow: auto;
            }

            .app {
                height: auto;
                min-height: 100vh;
                display: block;
            }

            .topbar {
                position: sticky;
                top: 0;
                z-index: 2000;
            }

            .brand {
                width: auto;
            }

            .brand span {
                display: none;
            }

            .sidebar {
                display: none;
            }

            .main {
                min-height: calc(100vh - 70px);
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .meta {
                grid-template-columns: 1fr;
            }

            .pageHead {
                align-items: flex-start;
                flex-direction: column;
            }

            .topActions .topBtn:not(.back) {
                display: none;
            }
        }
    </style>
</head>

                    "JSON dosyasını config klasörüne koyup Java tarafında bir JSON kütüphanesiyle okuyabilirsin."
            }),

            "Add Language Key": name => ({

                description:

                code: `{
  "examplemod.${name.toLowerCase()}":
    "${name}"
}`,
                usage:

            "Add Model JSON": name => ({

                description:

                code: `{

      "examplemod:item/${name.toLowerCase()}"

}`,
                usage:

            "Add Blockstate JSON": name => ({

            "Add Sound Definition": name => ({

            "Add Advancement": name => ({

    },

                usage:

            }),

            "Add Predicate": name => ({
                file: `src/main/resources/data/examplemod/predicate/${name.toLowerCase()}.json`,
                description:
                    "Datapack predicate sistemi için temel JSON örneğidir.",
                code: `{

                usage:

            "Add Tag": name => ({

                usage:

            }),

            "Add Loot Table": name => ({

                description:
                    "Temel loot table yapısını gösterir.",
                code: `{

    {

}`,
                usage:
                    "Dosyayı data/examplemod/loot_table klasörüne koy."
            }),

            "Add Recipe": name => ({
                file: `src/main/resources/data/examplemod/recipe/${name.toLowerCase()}.json`,
                description:
                    "Crafting recipe için temel JSON örneğidir.",
                code: `{
  "type":
    "minecraft:crafting_shaped",

  "pattern": [

  ],

  },

      "minecraft:stone",

  }
}`,
                usage:
                    "Recipe JSON'unu data/examplemod/recipe klasörüne koy."
            }),

            "Add Debug Log": name => ({
                file: `src/main/java/com/example/mod/DebugUtil.java`,
                description:
                    "Development sırasında konsola debug mesajı göndermek için basit yardımcı sınıf.",
                code: `public final class DebugUtil {

    private DebugUtil() {

    public static void log(
        String message
    ) {

        System.out.println(
            "[${name}] " + message
        );
    }
}`,
                usage: `DebugUtil.log("Test");`
            }),

            "Add Error Handler": name => ({
                file: `src/main/java/com/example/mod/ErrorUtil.java`,
                description:
                    "Java kodunun hata vermesi durumunda exception yakalamak için temel yapı.",
                code: `public static void run(
    Runnable action
) {

    try {

        action.run();

    } catch (Exception exception) {

        System.err.println(
            "[${name}] "
            + exception.getMessage()
        );

        exception.printStackTrace();
    }
}`,
                usage:
                    "ErrorUtil.run(() -> { /* kod */ });"
            }),

            "Add Performance Timer": name => ({
                file: `src/main/java/com/example/mod/PerformanceTimer.java`,
                description:
                    "Bir kod bölümünün çalışma süresini nanosecond hassasiyetinde ölçmek için kullanılır.",
                code: `long start =
    System.nanoTime();

try {

    // Ölçülecek kod

} finally {

    long elapsed =
        System.nanoTime() - start;

    System.out.println(
        "[${name}] "
        + (elapsed / 1_000_000.0)
        + " ms"
    );
}`,
                usage:
                    "Performansını ölçmek istediğin kodun etrafına yerleştir."
            })

        };


        /* =========================================================
           DATABASE
           ========================================================= */

        const tools = [];

        function className(category, operation, id) {

            return (
                category + " " + operation
            )
                .replace(/[^a-zA-Z0-9 ]/g, " ")
                .split(/\s+/)
                .filter(Boolean)
                .map(x =>
                    x.charAt(0).toUpperCase() + x.slice(1)
                )
                .join("")
                + "Example" + id;
        }


        function fallback(category, operation, name, id) {

            return {

                file:
                    `src/main/java/com/example/mod/${name}.java`,

                description:
                    `${category} kategorisinde ${operation} işlemini göstermek için oluşturulmuş açıklamalı Java başlangıç kodudur. Minecraft/Fabric API'ye doğrudan bağlanan bölümler hedef sürümün API'sine göre uyarlanmalıdır.`,

                code:
                    `package com.example.mod;

/**
 * LoliMod-İDEA
 *
 * Code:
 * #${id}
 *
 * Category:
 * ${category}
 *
 * Operation:
 * ${operation}
 */
public final class ${name} {

    private ${name}() {
    }

    public static void run() {

        System.out.println(
            "LoliMod-İDEA Code #${id}"
        );

        System.out.println(
            "Category: ${category}"
        );

        System.out.println(
            "Operation: ${operation}"
        );
    }
}`,

                usage:
                    `${name}.run();`

            };

        }


        let id = 1;

        for (const category of categories) {

            for (const operation of operations) {

                const name =
                    className(
                        category,
                        operation,
                        id
                    );

                let data;

                if (realTemplates[operation]) {

                    data =
                        realTemplates[operation](
                            name
                        );

                } else {

                    data =
                        fallback(
                            category,
                            operation,
                            name,
                            id
                        );

                }

                tools.push({

                    id,

                    number:
                        String(id)
                            .padStart(5, "0"),

                    category,

                    operation,

                    title:
                        `${category} • ${operation}`,

                    name,

                    file: data.file,

                    description: data.description,

                    code: data.code,

                    usage: data.usage

                });

                id++;

            }

        }

        while (tools.length < 10000) {

            const n = tools.length + 1;

            const category =
                categories[n % categories.length];

            const operation =
                operations[n % operations.length];

            const name =
                className(
                    category,
                    operation,
                    n
                );

            const data =
                fallback(
                    category,
                    operation,
                    name,
                    n
                );

            tools.push({
                id: n,
                number: String(n).padStart(5, "0"),
                category,
                operation,
                title: `${category} • ${operation}`,
                name,
                file: data.file,
                description: data.description,
                code: data.code,
                usage: data.usage
            });

        }


        /* =========================================================
           STATE
           ========================================================= */

        let currentCategory = "All";
        let currentSearch = "";
        let currentPage = 1;

        const perPage = 30;


        /* =========================================================
           DOM
           ========================================================= */

        const grid =
            document.getElementById("grid");

        const search =
            document.getElementById("search");

        const sideCategories =
            document.getElementById("sideCategories");

        const filters =
            document.getElementById("filters");

        const pagination =
            document.getElementById("pagination");

        const resultCount =
            document.getElementById("resultCount");

        const detail =
            document.getElementById("detail");


        /* =========================================================
           ESCAPE
           ========================================================= */

        function escapeHTML(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        /* =========================================================
           SIDEBAR
           ========================================================= */

        function renderSidebar() {

            sideCategories.innerHTML = "";

            const all = [
                "All",
                ...categories
            ];

            all.forEach(category => {

                const button =
                    document.createElement("button");

                button.className =
                    "sideCategory"
                    + (category === currentCategory
                        ? " active" : "");

                button.innerHTML = `

            <span>
                ${escapeHTML(category)}
            </span>

            <span class="sideCount">
                ${category === "All"
                        ? "10K"
                        : tools.filter(
                            x => x.category === category
                        ).length
                    }
            </span>

        `;

                button.onclick = () => {

                    currentCategory =
                        category;

                    currentPage = 1;

                    renderSidebar();
                    renderFilters();
                    render();

                };

                sideCategories.appendChild(
                    button
                );

            });

        }


        /* =========================================================
           FILTERS
           ========================================================= */

        function renderFilters() {

            filters.innerHTML = "";

            const all = [
                "All",
                ...categories.slice(0, 15)
            ];

            all.forEach(category => {

                const button =
                    document.createElement("button");

                button.className =
                    "filter"
                    + (category === currentCategory
                        ? " active" : "");

                button.textContent =
                    category;

                button.onclick = () => {

                    currentCategory =
                        category;

                    currentPage = 1;

                    renderSidebar();
                    renderFilters();
                    render();

                };

                filters.appendChild(
                    button
                );

            });

        }


        /* =========================================================
           FILTER DATA
           ========================================================= */

        function filteredTools() {

            const q =
                currentSearch
                    .trim()
                    .toLowerCase();

            return tools.filter(tool => {

                if (
                    currentCategory !== "All"
                    &&
                    tool.category !== currentCategory
                ) {
                    return false;
                }

                if (!q) {
                    return true;
                }

                return (

                    tool.title.toLowerCase().includes(q)

                    ||

                    tool.category.toLowerCase().includes(q)

                    ||

                    tool.operation.toLowerCase().includes(q)

                    ||

                    tool.file.toLowerCase().includes(q)

                    ||

                    tool.description.toLowerCase().includes(q)

                );

            });

        }


        /* =========================================================
           RENDER
           ========================================================= */

        function render() {

            const result =
                filteredTools();

            const pages =
                Math.max(
                    1,
                    Math.ceil(
                        result.length / perPage
                    )
                );

            if (currentPage > pages) {
                currentPage = pages;
            }

            const start =
                (currentPage - 1) * perPage;

            const pageItems =
                result.slice(
                    start,
                    start + perPage
                );

            resultCount.textContent =
                `${result.length.toLocaleString("tr-TR")} kod`;


            if (!pageItems.length) {

                grid.innerHTML = `
            <div class="empty">
                🔎 Sonuç bulunamadı.
            </div>
        `;

            } else {

                grid.innerHTML =
                    pageItems.map(tool => `

                <article class="card">

                    <div class="cardHeader">

                        <span class="id">
                            #${tool.number}
                        </span>

                        <span class="cat">
                            ${escapeHTML(tool.category)}
                        </span>

                    </div>

                    <h3>
                        ${escapeHTML(tool.title)}
                    </h3>

                    <div class="desc">
                        ${escapeHTML(
                        tool.description
                    ).slice(0, 190)}
                        ...
                    </div>

                    <div class="file">
                        ${escapeHTML(tool.file)}
                    </div>

                    <div class="cardBottom">

                        <button
                            class="open"
                            onclick="openTool(${tool.id})"
                        >
                            View Code →
                        </button>

                    </div>

                </article>

            `).join("");

            }

            renderPagination(pages);

        }


        /* =========================================================
           PAGINATION
           ========================================================= */

        function renderPagination(totalPages) {

            pagination.innerHTML = "";

            const add = (text, page, active = false) => {

                const button =
                    document.createElement("button");

                button.className =
                    "page"
                    + (active ? " active" : "");

                button.textContent =
                    text;

                button.onclick = () => {

                    currentPage = page;

                    render();

                    document
                        .querySelector(".main")
                        .scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                };

                pagination.appendChild(button);

            };


            if (currentPage > 1) {

                add(
                    "←",
                    currentPage - 1
                );

            }


            let start =
                Math.max(
                    1,
                    currentPage - 3
                );

            let end =
                Math.min(
                    totalPages,
                    start + 6
                );


            if (end - start < 6) {

                start =
                    Math.max(
                        1,
                        end - 6
                    );

            }


            for (
                let p = start;
                p <= end;
                p++
            ) {

                add(
                    String(p),
                    p,
                    p === currentPage
                );

            }


            if (currentPage < totalPages) {

                add(
                    "→",
                    currentPage + 1
                );

            }

        }


        /* =========================================================
           OPEN TOOL
           ========================================================= */

        function openTool(id) {

            const tool =
                tools.find(
                    x => x.id === id
                );

            if (!tool) {
                return;
            }

            document.getElementById(
                "detailTitle"
            ).textContent =
                `#${tool.number} • ${tool.title}`;

            document.getElementById(
                "detailId"
            ).textContent =
                "#" + tool.number;

            document.getElementById(
                "detailCategory"
            ).textContent =
                tool.category;

            document.getElementById(
                "detailFile"
            ).textContent =
                tool.file;

            document.getElementById(
                "detailDescription"
            ).textContent =
                stripHTML(tool.description);

            document.getElementById(
                "detailCode"
            ).textContent =
                tool.code;

            document.getElementById(
                "detailUsage"
            ).textContent =
                tool.usage;

            detail.classList.add("show");

        }


        function stripHTML(text) {

            const div =
                document.createElement("div");

            div.innerHTML = text;

            return div.textContent || "";

        }


        /* =========================================================
           CLOSE
           ========================================================= */

        document
            .getElementById("closeDetail")
            .onclick = () => {
                detail.classList.remove("show");
            };


        detail.onclick = e => {

            if (e.target === detail) {
                detail.classList.remove("show");
            }

        };


        document.addEventListener(
            "keydown",
            e => {

                if (e.key === "Escape") {
                    detail.classList.remove("show");
                }

            });


        /* =========================================================
           COPY
           ========================================================= */

        document
            .getElementById("copy")
            .onclick = async () => {

                const code =
                    document.getElementById(
                        "detailCode"
                    ).textContent;

                try {

                    await navigator.clipboard.writeText(
                        code
                    );

                    document.getElementById(
                        "copy"
                    ).textContent =
                        "✓ Kopyalandı";

                    setTimeout(() => {

                        document.getElementById(
                            "copy"
                        ).textContent =
                            "📋 Kopyala";

                    }, 1300);

                } catch {

                    const textarea =
                        document.createElement(
                            "textarea"
                        );

                    textarea.value = code;

                    document.body.appendChild(
                        textarea
                    );

                    textarea.select();

                    document.execCommand("copy");

                    textarea.remove();

                }

            };


        /* =========================================================
           SEARCH
           ========================================================= */

        let timer;

        search.addEventListener(
            "input",
            () => {

                clearTimeout(timer);

                timer =
                    setTimeout(() => {

                        currentSearch =
                            search.value;

                        currentPage = 1;

                        render();

                    }, 70);

            });


        /* =========================================================
           LANGUAGE
           ========================================================= */

        let language =
            localStorage.getItem(
                "lolimod-language"
            ) || "tr";

        const languageButton =
            document.getElementById(
                "language"
            );

        languageButton.onclick = () => {

            language =
                language === "tr"
                    ? "en"
                    : "tr";

            localStorage.setItem(
                "lolimod-language",
                language
            );

            languageButton.textContent =
                language === "tr"
                    ? "EN"
                    : "TR";

        };


        /* =========================================================
           INIT
           ========================================================= */

        renderSidebar();

        renderFilters();

        render();


        console.log(
            "LoliMod-İDEA Help loaded"
        );

        console.log(
            "Categories:",
            categories.length
        );

        console.log(
            "Operations:",
            operations.length
        );

        console.log(
            "Total records:",
            tools.length
        );

    </script>

</body>
